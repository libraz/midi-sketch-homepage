<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" role="img" aria-labelledby="tva-ttl tva-dsc">
  <title id="tva-ttl">ボーカル生成を構成する 3 つのコンポーネントの関係</title>
  <desc id="tva-dsc">左から右へのパイプラインです。左端の VocalStyleProfile が 2 つの設定を供給します。StyleBias は生成される音の偏りを決め、EvaluatorConfig は候補の採点の重みを決めます。中央の MelodyDesigner は候補フレーズをまとめて生成し、それぞれを採点し、下位半分を切り捨てたうえで残りからスコア重み付きで抽選します。右側の Vocal Generator は制約パイプラインを通し、セクションタイプ・小節数・開始コード度数をキーとするキャッシュにフレーズを保存し、ボーカルトラックへ書き出します。</desc>

  <defs>
    <marker id="tva-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="364" rx="12"/>

  <rect class="grp" x="24" y="40" width="210" height="250" rx="8"/>
  <text class="lbl" x="38" y="62">スタイルごと</text>
  <rect class="card" x="34" y="72" width="190" height="30" rx="6"/>
  <text class="mono" x="129" y="91" text-anchor="middle">VocalStyleProfile</text>
  <rect class="chip" x="34" y="112" width="190" height="54" rx="5"/>
  <text class="mono" x="46" y="132">StyleBias</text>
  <text class="s" x="46" y="152">音の選び方を偏らせる</text>
  <rect class="chip" x="34" y="176" width="190" height="54" rx="5"/>
  <text class="mono" x="46" y="196">EvaluatorConfig</text>
  <text class="s" x="46" y="216">採点の重みを決める</text>
  <text class="s" x="34" y="252">1 スタイル 1 プロファイル</text>
  <text class="s" x="34" y="268">なので生成と評価がずれません。</text>

  <path class="ln" d="M 234 165 H 254" marker-end="url(#tva-a)"/>

  <rect class="grp" x="258" y="40" width="372" height="250" rx="8"/>
  <text class="lbl" x="272" y="62">MelodyDesigner</text>

  <rect class="chip" x="270" y="72" width="348" height="52" rx="5"/>
  <text class="h" x="282" y="93">候補を生成</text>
  <text class="s" x="282" y="112">サビ 100 · B 50 · ブリッジ 30 · その他 20</text>

  <path class="ln" d="M 444 124 V 134" marker-end="url(#tva-a)"/>

  <rect class="chip" x="270" y="138" width="348" height="64" rx="5"/>
  <text class="lbl" x="282" y="158">各候補を採点</text>
  <text class="s" x="282" y="177">スタイル 40% · カリング 40% · バイアス 20%</text>
  <text class="s" x="282" y="193">さらにセクション別重みのモチーフ加点</text>

  <path class="ln" d="M 444 202 V 212" marker-end="url(#tva-a)"/>

  <rect class="chip" x="270" y="216" width="348" height="62" rx="5"/>
  <text class="h" x="282" y="237">上位半分を残し、重み付きで抽選</text>
  <text class="s" x="282" y="256">最高スコアはあくまでフォールバックで、</text>
  <text class="s" x="282" y="272">自動的に採用されるわけではありません</text>

  <path class="ln" d="M 630 165 H 650" marker-end="url(#tva-a)"/>

  <rect class="grp" x="654" y="40" width="282" height="250" rx="8"/>
  <text class="lbl" x="668" y="62">Vocal Generator</text>

  <rect class="chip" x="666" y="72" width="258" height="66" rx="5"/>
  <text class="h" x="678" y="93">制約パイプライン</text>
  <text class="s" x="678" y="112">ボイスリーディング・安全な音程・</text>
  <text class="s" x="678" y="128">音域へのオクターブフォールド</text>

  <path class="ln" d="M 795 138 V 148" marker-end="url(#tva-a)"/>

  <rect class="chip" x="666" y="152" width="258" height="66" rx="5"/>
  <text class="h" x="678" y="173">フレーズキャッシュ</text>
  <text class="s" x="678" y="192">セクションタイプ・小節数・</text>
  <text class="s" x="678" y="208">開始コード度数がキー</text>

  <path class="ln" d="M 795 218 V 228" marker-end="url(#tva-a)"/>

  <rect class="chip" x="666" y="232" width="258" height="46" rx="5"/>
  <text class="h" x="678" y="253">ボーカルトラックへ書き出し</text>
  <text class="s" x="678" y="270">MidiTrack 1 本、チャンネル 0</text>

  <path class="seam" d="M 24 318 H 936"/>
  <text class="s" x="480" y="340" text-anchor="middle">プロファイルは 2 度読まれます。何を生成するかを偏らせるときと、何を残すかを重み付けるときです。</text>
</svg>
