<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" role="img" aria-labelledby="vfi-ttl vfi-dsc">
  <title id="vfi-ttl">The vocal-first loop: audition the melody, retry it, then commit to the backing</title>
  <desc id="vfi-dsc">A left-to-right loop. generateVocal writes a first take, which is previewed; if it is not the one, regenerateVocal produces another take from a new seed or VocalConfig and the preview repeats. Only when the melody is kept does generateAccompaniment write the backing tracks, which adapt to that melody, and the song is exported as a Standard MIDI File. A one-shot alternative, generateWithVocal, does the same vocal-priority ordering in a single call with no preview loop.</desc>

  <defs>
    <marker id="vfi-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="vfi-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="306" rx="12"/>

  <rect class="grp" x="24" y="48" width="560" height="152" rx="8"/>
  <text class="lbl" x="38" y="70">iterate on the melody</text>

  <rect class="chip" x="40" y="84" width="160" height="44" rx="5"/>
  <text class="mono" x="120" y="104" text-anchor="middle">generateVocal</text>
  <text class="s" x="120" y="120" text-anchor="middle">first take</text>

  <path class="ln" d="M 200 106 H 222" marker-end="url(#vfi-a)"/>

  <rect class="chip" x="226" y="84" width="150" height="44" rx="5"/>
  <text class="h" x="301" y="104" text-anchor="middle">Preview</text>
  <text class="s" x="301" y="120" text-anchor="middle">listen, read the roll</text>

  <path class="ln" d="M 376 106 H 398" marker-end="url(#vfi-a)"/>

  <rect class="chip" x="402" y="84" width="150" height="44" rx="5"/>
  <text class="h" x="477" y="104" text-anchor="middle">Satisfied?</text>
  <text class="s" x="477" y="120" text-anchor="middle">keep it or retry</text>

  <path class="lnd" d="M 477 128 V 168 H 400" marker-end="url(#vfi-a)"/>
  <text class="s" x="486" y="152">no</text>

  <rect class="chip" x="206" y="148" width="190" height="40" rx="5"/>
  <text class="mono" x="301" y="166" text-anchor="middle">regenerateVocal</text>
  <text class="s" x="301" y="182" text-anchor="middle">new seed or VocalConfig</text>

  <path class="lnd" d="M 301 148 V 131" marker-end="url(#vfi-a)"/>

  <path class="ln" d="M 552 106 H 596" marker-end="url(#vfi-a)"/>
  <text class="s" x="560" y="98">yes</text>

  <rect class="grp" x="600" y="48" width="336" height="152" rx="8"/>
  <text class="lbl" x="614" y="70">commit</text>

  <rect class="card" x="616" y="84" width="304" height="44" rx="6"/>
  <text class="mono" x="768" y="104" text-anchor="middle">generateAccompaniment</text>
  <text class="s" x="768" y="120" text-anchor="middle">the backing adapts to that melody</text>

  <path class="ln" d="M 768 128 V 140" marker-end="url(#vfi-a)"/>

  <rect class="chip" x="616" y="144" width="304" height="44" rx="5"/>
  <text class="h" x="768" y="164" text-anchor="middle">Export MIDI</text>
  <text class="mono" x="768" y="180" text-anchor="middle">getMidi()</text>

  <rect class="alt" x="24" y="214" width="912" height="36" rx="6"/>
  <text class="lbl" x="40" y="236">one-shot alternative</text>
  <text class="mono" x="168" y="236">generateWithVocal</text>
  <path class="ln2" d="M 288 231 H 306" marker-end="url(#vfi-b)"/>
  <text class="s" x="316" y="236">the same vocal-priority order in a single call, with no preview loop in between</text>

  <path class="seam" d="M 24 270 H 936"/>
  <text class="s" x="480" y="290" text-anchor="middle">Retrying costs only the melody — the backing is written once, against the take you kept.</text>
</svg>
