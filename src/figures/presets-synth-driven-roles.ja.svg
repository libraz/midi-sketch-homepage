<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="sdr-ttl sdr-dsc">
  <title id="sdr-ttl">SynthDriven — 生成されるトラックとそれぞれの役割</title>
  <desc id="sdr-dsc">4 つのトラックがミックスに集まります。アルペジオがリード、コードはパッドとして働き、ベースとドラムが低音の土台とリズムを受け持ちます。ボーカルと Aux はどちらも生成されません。またアルペジオは自動では有効になりません。arpeggioEnabled を true にしたときだけ鳴ります。</desc>

  <defs>
    <marker id="sdr-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="250" rx="12"/>

  <text class="lbl" x="36" y="46">生成されるトラック</text>

  <rect class="card" x="127" y="56" width="169" height="44" rx="6"/>
  <text class="h" x="211" y="77" text-anchor="middle">アルペジオ</text>
  <text class="s" x="211" y="93" text-anchor="middle">リード</text>

  <rect class="chip" x="306" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="390" y="77" text-anchor="middle">コード</text>
  <text class="s" x="390" y="93" text-anchor="middle">パッド</text>

  <rect class="chip" x="485" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="569" y="77" text-anchor="middle">ベース</text>
  <text class="s" x="569" y="93" text-anchor="middle">低音の土台</text>

  <rect class="chip" x="664" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="748" y="77" text-anchor="middle">ドラム</text>
  <text class="s" x="748" y="93" text-anchor="middle">リズム</text>

  <path class="ln" d="M 211 102 V 122" marker-end="url(#sdr-a)"/>
  <path class="ln" d="M 390 102 V 122" marker-end="url(#sdr-a)"/>
  <path class="ln" d="M 569 102 V 122" marker-end="url(#sdr-a)"/>
  <path class="ln" d="M 748 102 V 122" marker-end="url(#sdr-a)"/>

  <rect class="chip" x="36" y="124" width="888" height="36" rx="5"/>
  <text class="h" x="480" y="147" text-anchor="middle">ミックス</text>

  <rect class="warn" x="36" y="176" width="336" height="28" rx="6"/>
  <text class="s" x="204" y="195" text-anchor="middle">ボーカルと Aux — 生成されません</text>
  <text class="s" x="390" y="195">アルペジオは手動で有効化します:</text>
  <text class="mono" x="580" y="195">arpeggioEnabled = true</text>

  <path class="seam" d="M 24 214 H 936"/>
  <text class="s" x="480" y="234" text-anchor="middle">歌う声が両方とも止まるため、上声部を担うのはアルペジオです。有効にしなければ何も鳴りません。</text>
</svg>
