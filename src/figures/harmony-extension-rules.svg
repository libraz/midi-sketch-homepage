<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" role="img" aria-labelledby="xt-ttl xt-dsc">
  <title id="xt-ttl">The three extension tests, in the order they run</title>
  <desc id="xt-dsc">Three lanes, each with a condition, a probability roll and a result. The sus test looks at the bar position — the first or next-to-last bar of a section — and skips minor chords; it yields Sus4 seventy percent of the time and Sus2 otherwise. The seventh test applies in B and Chorus sections or on V, where the threshold is doubled. The ninth test applies to any chord in a Chorus, or to V inside a B section. The first test that passes returns; if none does, the chord stays a plain triad. A caveat notes that Chorus chords are rewritten beforehand.</desc>

  <defs>
    <marker id="xt-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="xt-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="418" rx="12"/>

  <text class="lbl" x="24" y="38">the three tests run in this order — the first one that passes wins, and a chord never gets two extensions</text>

  <rect class="grp" x="24" y="48" width="912" height="72" rx="8"/>
  <text class="lbl" x="38" y="88">1 · sus</text>
  <rect class="chip" x="92" y="62" width="300" height="44" rx="5"/>
  <text class="s" x="102" y="82">the first bar of the section, or the</text>
  <text class="s" x="102" y="98">next-to-last bar — and not a minor chord</text>
  <path class="ln" d="M 394 84 H 420" marker-end="url(#xt-a)"/>
  <rect class="chip" x="422" y="62" width="170" height="44" rx="5"/>
  <text class="mono" x="432" y="82">roll &lt; susProb</text>
  <text class="s" x="432" y="98">one roll per chord</text>
  <path class="ln2" d="M 594 84 H 620" marker-end="url(#xt-b)"/>
  <rect class="alt" x="622" y="62" width="298" height="44" rx="6"/>
  <text class="s" x="632" y="82">Sus4 — 70% of the time</text>
  <text class="s" x="632" y="98">Sus2 — the other 30%</text>

  <rect class="grp" x="24" y="132" width="912" height="72" rx="8"/>
  <text class="lbl" x="38" y="172">2 · 7th</text>
  <rect class="chip" x="92" y="146" width="300" height="44" rx="5"/>
  <text class="s" x="102" y="166">the section is B or Chorus,</text>
  <text class="s" x="102" y="182">or the chord is V</text>
  <path class="ln" d="M 394 168 H 420" marker-end="url(#xt-a)"/>
  <rect class="chip" x="422" y="146" width="170" height="44" rx="5"/>
  <text class="mono" x="432" y="166">roll &lt; 7thProb</text>
  <text class="s" x="432" y="182">V doubles the threshold</text>
  <path class="ln2" d="M 594 168 H 620" marker-end="url(#xt-b)"/>
  <rect class="alt" x="622" y="146" width="298" height="44" rx="6"/>
  <text class="s" x="632" y="166">V → Dom7 · minor → Min7</text>
  <text class="s" x="632" y="182">everything else → Maj7</text>

  <rect class="grp" x="24" y="216" width="912" height="72" rx="8"/>
  <text class="lbl" x="38" y="256">3 · 9th</text>
  <rect class="chip" x="92" y="230" width="300" height="44" rx="5"/>
  <text class="s" x="102" y="250">the section is Chorus — any chord —</text>
  <text class="s" x="102" y="266">or the chord is V inside a B section</text>
  <path class="ln" d="M 394 252 H 420" marker-end="url(#xt-a)"/>
  <rect class="chip" x="422" y="230" width="170" height="44" rx="5"/>
  <text class="mono" x="432" y="250">roll &lt; 9thProb</text>
  <text class="s" x="432" y="266">a roll of its own</text>
  <path class="ln2" d="M 594 252 H 620" marker-end="url(#xt-b)"/>
  <rect class="alt" x="622" y="230" width="298" height="44" rx="6"/>
  <text class="s" x="632" y="250">V → Dom9 · I → Maj9 · ii or vi → Min9</text>
  <text class="s" x="632" y="266">iii → Min7 · anything else → Add9</text>

  <path class="lnd" d="M 287 288 V 300" marker-end="url(#xt-a)"/>

  <rect class="chip" x="92" y="304" width="390" height="44" rx="5"/>
  <text class="s" x="102" y="324">no test matched — the chord stays a plain triad</text>
  <text class="s" x="102" y="340">and with all three flags off, none of this runs at all</text>

  <rect class="warn" x="502" y="304" width="418" height="44" rx="6"/>
  <text class="mono" x="512" y="324">reharmonizeForSection</text>
  <text class="s" x="512" y="340">settles Chorus chords first, so this table applies elsewhere</text>

  <path class="seam" d="M 24 372 H 936"/>
  <text class="s" x="480" y="394" text-anchor="middle">Only one extension is ever applied: the first test that passes returns, and the tests below it are never reached.</text>
</svg>
