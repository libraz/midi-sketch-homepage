<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="bmr-ttl bmr-dsc">
  <title id="bmr-ttl">BackgroundMotif — 生成されるトラックとそれぞれの役割</title>
  <desc id="bmr-dsc">5 つのトラックがミックスに集まります。繰り返されるモチーフがリード、Aux が副旋律を担い、コード・ベース・ドラムがハーモニーの土台、低音の土台、リズムを受け持ちます。ボーカルトラックは生成されませんが、Aux は有効のまま残り、モチーフに寄り添う旋律を受け持ちます。</desc>

  <defs>
    <marker id="bmr-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="250" rx="12"/>

  <text class="lbl" x="36" y="46">生成されるトラック</text>

  <rect class="card" x="36" y="56" width="169" height="44" rx="6"/>
  <text class="h" x="120" y="77" text-anchor="middle">モチーフ</text>
  <text class="s" x="120" y="93" text-anchor="middle">リード</text>

  <rect class="chip" x="215" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="299" y="77" text-anchor="middle">Aux</text>
  <text class="s" x="299" y="93" text-anchor="middle">副旋律</text>

  <rect class="chip" x="394" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="478" y="77" text-anchor="middle">コード</text>
  <text class="s" x="478" y="93" text-anchor="middle">ハーモニーの土台</text>

  <rect class="chip" x="573" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="657" y="77" text-anchor="middle">ベース</text>
  <text class="s" x="657" y="93" text-anchor="middle">低音の土台</text>

  <rect class="chip" x="752" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="836" y="77" text-anchor="middle">ドラム</text>
  <text class="s" x="836" y="93" text-anchor="middle">リズム</text>

  <path class="ln" d="M 120 102 V 122" marker-end="url(#bmr-a)"/>
  <path class="ln" d="M 299 102 V 122" marker-end="url(#bmr-a)"/>
  <path class="ln" d="M 478 102 V 122" marker-end="url(#bmr-a)"/>
  <path class="ln" d="M 657 102 V 122" marker-end="url(#bmr-a)"/>
  <path class="ln" d="M 836 102 V 122" marker-end="url(#bmr-a)"/>

  <rect class="chip" x="36" y="124" width="888" height="36" rx="5"/>
  <text class="h" x="480" y="147" text-anchor="middle">ミックス</text>

  <rect class="warn" x="36" y="176" width="336" height="28" rx="6"/>
  <text class="s" x="204" y="195" text-anchor="middle">ボーカル — 生成されません</text>
  <text class="s" x="390" y="195">Aux は有効のまま、副旋律を担当します</text>

  <path class="seam" d="M 24 214 H 936"/>
  <text class="s" x="480" y="234" text-anchor="middle">歌ではなく繰り返しのパターンが前面に立つため、このスタイルは BGM に向いています。</text>
</svg>
