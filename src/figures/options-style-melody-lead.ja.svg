<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" role="img" aria-labelledby="oml-ttl oml-dsc">
  <title id="oml-ttl">MelodyLead — 有効なオプションと生成されるトラック</title>
  <desc id="oml-dsc">compositionStyle は 0、既定値です。ボーカル系はすべて有効、アルペジオはオンにすれば有効、転調も有効です。モチーフ系は Blueprint がモチーフを求めない限り効きません。トラックはボーカル・Aux・モチーフ・ベース・コード・ギター・アルペジオ・ドラム・SE の順に 9 本書かれ、モチーフとアルペジオは条件付きです。</desc>

  <rect class="bg" x="0" y="0" width="960" height="266" rx="12"/>

  <rect class="card" x="24" y="40" width="250" height="52" rx="6"/>
  <text class="mono" x="149" y="64" text-anchor="middle">compositionStyle = 0</text>
  <text class="s" x="149" y="84" text-anchor="middle">MelodyLead — 既定</text>

  <rect class="grp" x="298" y="32" width="638" height="68" rx="8"/>
  <text class="lbl" x="310" y="52">オプション系統</text>
  <rect class="chip" x="310" y="58" width="194" height="28" rx="5"/>
  <text class="s" x="407" y="77" text-anchor="middle">ボーカル系 — すべて有効</text>
  <rect class="chip" x="520" y="58" width="194" height="28" rx="5"/>
  <text class="s" x="617" y="77" text-anchor="middle">アルペジオ — オンなら有効</text>
  <rect class="chip" x="730" y="58" width="194" height="28" rx="5"/>
  <text class="s" x="827" y="77" text-anchor="middle">転調 — 有効</text>

  <rect class="chip" x="298" y="110" width="638" height="32" rx="5"/>
  <text class="s" x="310" y="130">モチーフ系は、Blueprint がモチーフを求めない限り効きません</text>

  <text class="lbl" x="26" y="176">生成トラック（順番）</text>
  <text class="s" x="936" y="176" text-anchor="end">ティール = 条件付きスロット</text>

  <rect class="chip" x="24" y="184" width="96" height="28" rx="5"/>
  <text class="s" x="72" y="203" text-anchor="middle">1 · ボーカル</text>
  <rect class="chip" x="126" y="184" width="96" height="28" rx="5"/>
  <text class="s" x="174" y="203" text-anchor="middle">2 · Aux</text>
  <rect class="alt" x="228" y="184" width="96" height="28" rx="6"/>
  <text class="s" x="276" y="203" text-anchor="middle">3 · モチーフ</text>
  <rect class="chip" x="330" y="184" width="96" height="28" rx="5"/>
  <text class="s" x="378" y="203" text-anchor="middle">4 · ベース</text>
  <rect class="chip" x="432" y="184" width="96" height="28" rx="5"/>
  <text class="s" x="480" y="203" text-anchor="middle">5 · コード</text>
  <rect class="chip" x="534" y="184" width="96" height="28" rx="5"/>
  <text class="s" x="582" y="203" text-anchor="middle">6 · ギター</text>
  <rect class="alt" x="636" y="184" width="96" height="28" rx="6"/>
  <text class="s" x="684" y="203" text-anchor="middle">7 · アルペジオ</text>
  <rect class="chip" x="738" y="184" width="96" height="28" rx="5"/>
  <text class="s" x="786" y="203" text-anchor="middle">8 · ドラム</text>
  <rect class="chip" x="840" y="184" width="96" height="28" rx="5"/>
  <text class="s" x="888" y="203" text-anchor="middle">9 · SE</text>

  <path class="seam" d="M 24 232 H 936"/>
  <text class="s" x="480" y="252" text-anchor="middle">ボーカルトラックを書くコンポジションスタイルは MelodyLead だけです。</text>
</svg>
