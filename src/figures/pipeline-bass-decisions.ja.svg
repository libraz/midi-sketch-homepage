<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="bas-ttl bas-dsc">
  <title id="bas-ttl">ベース 1 小節ぶんの判断の流れ</title>
  <desc id="bas-dsc">ベースの 1 小節はコードのルート音から始まります。ボーカルが既にある場合は、それに対する動きを選び、同音になるところはオクターブ下へ逃がします。次にセクションの種類が、どのベースパターンをどの強さで弾くかを決めます。実際の音はパターンが並べ、次の小節のルートへ向かうアプローチノートを加えます。4 小節ごとに小さな揺らぎも入ります。</desc>

  <defs>
    <marker id="bas-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="280" rx="12"/>

  <rect class="chip" x="24" y="110" width="160" height="48" rx="5"/>
  <text class="h" x="104" y="132" text-anchor="middle">ルート音</text>
  <text class="s" x="104" y="150" text-anchor="middle">この小節のコードから</text>

  <path class="ln" d="M 184 134 H 202" marker-end="url(#bas-a)"/>

  <rect class="grp" x="206" y="88" width="232" height="92" rx="8"/>
  <text class="lbl" x="218" y="108">ボーカルがある場合</text>
  <rect class="chip" x="218" y="114" width="208" height="28" rx="5"/>
  <text class="s" x="322" y="132" text-anchor="middle">ボーカルに対する動きを選ぶ</text>
  <rect class="chip" x="218" y="148" width="208" height="28" rx="5"/>
  <text class="s" x="322" y="166" text-anchor="middle">同音はオクターブ下へ</text>

  <path class="ln" d="M 438 134 H 456" marker-end="url(#bas-a)"/>

  <rect class="grp" x="460" y="88" width="250" height="92" rx="8"/>
  <text class="lbl" x="472" y="108">セクションが決めるもの</text>
  <rect class="chip" x="472" y="114" width="226" height="28" rx="5"/>
  <text class="s" x="585" y="132" text-anchor="middle">どのベースパターンか</text>
  <rect class="chip" x="472" y="148" width="226" height="28" rx="5"/>
  <text class="s" x="585" y="166" text-anchor="middle">どの強さで弾くか</text>

  <path class="ln" d="M 710 134 H 722 V 120 H 728" marker-end="url(#bas-a)"/>

  <rect class="card" x="732" y="104" width="204" height="32" rx="6"/>
  <text class="h" x="834" y="125" text-anchor="middle">パターンが鳴らす</text>

  <path class="ln" d="M 834 136 V 148" marker-end="url(#bas-a)"/>

  <rect class="chip" x="732" y="152" width="204" height="44" rx="5"/>
  <text class="s" x="834" y="170" text-anchor="middle">アプローチノートが次の</text>
  <text class="s" x="834" y="186" text-anchor="middle">小節のルートへつなぐ</text>

  <text class="s" x="480" y="222" text-anchor="middle">4 小節ごとに、休符・オクターブ跳躍・アプローチノート追加・そのまま、のいずれかの揺らぎが入ります。</text>

  <path class="seam" d="M 24 246 H 936"/>
  <text class="s" x="480" y="266" text-anchor="middle">ベースはまずボーカルに、次にセクションに従います。残りはパターンが決めます。</text>
</svg>
