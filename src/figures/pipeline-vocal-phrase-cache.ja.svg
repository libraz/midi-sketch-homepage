<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="vpc-ttl vpc-dsc">
  <title id="vpc-ttl">ボーカル生成が既存フレーズを再利用する流れ</title>
  <desc id="vpc-dsc">セクションごとに、フレーズがキャッシュ済みかを確認します。無ければメロディテンプレートを選び、強拍にコードトーンの骨格を置き、その間を順次進行で埋め、装飾を加えて保存します。有ればキャッシュしたフレーズに変化を付けて取り出します。どちらの経路も、そのあと衝突回避・セクション上限・スケール補正と音域クランプを通ります。</desc>

  <defs>
    <marker id="vpc-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="vpc-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="290" rx="12"/>

  <rect class="chip" x="24" y="52" width="112" height="30" rx="5"/>
  <text class="h" x="80" y="71" text-anchor="middle">セクション</text>

  <path class="ln" d="M 136 67 H 154" marker-end="url(#vpc-a)"/>

  <rect class="card" x="158" y="52" width="132" height="30" rx="6"/>
  <text class="h" x="224" y="71" text-anchor="middle">キャッシュ済み?</text>

  <path class="ln" d="M 290 67 H 322" marker-end="url(#vpc-a)"/>
  <text class="s" x="298" y="59">なし</text>

  <rect class="grp" x="330" y="40" width="606" height="88" rx="8"/>
  <text class="lbl" x="344" y="60">キャッシュなし — フレーズを組み立てる</text>

  <rect class="chip" x="344" y="68" width="100" height="44" rx="5"/>
  <text class="s" x="394" y="86" text-anchor="middle">メロディ</text>
  <text class="s" x="394" y="100" text-anchor="middle">テンプレート</text>
  <path class="ln" d="M 444 90 H 456" marker-end="url(#vpc-a)"/>

  <rect class="chip" x="460" y="68" width="100" height="44" rx="5"/>
  <text class="s" x="510" y="86" text-anchor="middle">強拍に</text>
  <text class="s" x="510" y="100" text-anchor="middle">コードトーン</text>
  <path class="ln" d="M 560 90 H 572" marker-end="url(#vpc-a)"/>

  <rect class="chip" x="576" y="68" width="100" height="44" rx="5"/>
  <text class="s" x="626" y="86" text-anchor="middle">その間を</text>
  <text class="s" x="626" y="100" text-anchor="middle">順次進行で</text>
  <path class="ln" d="M 676 90 H 688" marker-end="url(#vpc-a)"/>

  <rect class="chip" x="692" y="68" width="100" height="44" rx="5"/>
  <text class="s" x="742" y="93" text-anchor="middle">装飾を追加</text>
  <path class="ln" d="M 792 90 H 804" marker-end="url(#vpc-a)"/>

  <rect class="chip" x="808" y="68" width="100" height="44" rx="5"/>
  <text class="s" x="858" y="86" text-anchor="middle">キャッシュ</text>
  <text class="s" x="858" y="100" text-anchor="middle">に保存</text>

  <path class="ln2" d="M 224 82 V 144 H 322" marker-end="url(#vpc-b)"/>
  <text class="s" x="232" y="110">あり</text>

  <rect class="alt" x="330" y="130" width="260" height="28" rx="6"/>
  <text class="s" x="460" y="148" text-anchor="middle">変化を付けて再利用</text>

  <path class="ln" d="M 858 112 V 176 H 460"/>
  <path class="ln2" d="M 460 158 V 176"/>
  <path class="ln" d="M 460 176 V 196" marker-end="url(#vpc-a)"/>

  <rect class="chip" x="330" y="200" width="190" height="32" rx="5"/>
  <text class="s" x="425" y="220" text-anchor="middle">衝突回避</text>
  <path class="ln" d="M 520 216 H 536" marker-end="url(#vpc-a)"/>
  <rect class="chip" x="544" y="200" width="160" height="32" rx="5"/>
  <text class="s" x="624" y="220" text-anchor="middle">セクション上限</text>
  <path class="ln" d="M 704 216 H 720" marker-end="url(#vpc-a)"/>
  <rect class="chip" x="728" y="200" width="192" height="32" rx="5"/>
  <text class="s" x="824" y="220" text-anchor="middle">スケール補正と音域クランプ</text>

  <text class="s" x="30" y="196">キャッシュのキーはセクション種別・</text>
  <text class="s" x="30" y="212">小節数・コード度数です。繰り返すサビは</text>
  <text class="s" x="30" y="228">ここで当たり、変化を付けて戻ります。</text>

  <path class="seam" d="M 24 256 H 936"/>
  <text class="s" x="480" y="276" text-anchor="middle">メロディテンプレートとボーカルアティチュードは独立した工程ではなく、この流れ全体の判断を導きます。</text>
</svg>
