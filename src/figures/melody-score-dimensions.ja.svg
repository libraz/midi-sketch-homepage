<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" role="img" aria-labelledby="mels-ttl mels-dsc">
  <title id="mels-ttl">メロディスコアの 7 次元</title>
  <desc id="mels-dsc">歌いやすさ・コードトーン率・輪郭形状・サプライズ要素・AAAB パターン・リズムと音程の相関・キャッチーさという 7 つの箱が横一列に並び、それぞれ 0.0〜1.0 の値を出します。7 つはすべて 1 本のバスに集まり、ボーカルスタイル別の重みを掛けて合計され、1 つの合計メロディスコアになります。</desc>

  <defs>
    <marker id="mels-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="336" rx="12"/>

  <text class="lbl" x="37" y="56">メロディスコア — 7 次元、各 0.0〜1.0</text>

  <rect class="chip" x="37" y="70" width="117" height="42" rx="5"/>
  <text class="s" x="95" y="96" text-anchor="middle">歌いやすさ</text>
  <rect class="chip" x="165" y="70" width="117" height="42" rx="5"/>
  <text class="s" x="223" y="96" text-anchor="middle">コードトーン率</text>
  <rect class="chip" x="293" y="70" width="117" height="42" rx="5"/>
  <text class="s" x="351" y="96" text-anchor="middle">輪郭形状</text>
  <rect class="chip" x="421" y="70" width="117" height="42" rx="5"/>
  <text class="s" x="479" y="96" text-anchor="middle">サプライズ要素</text>
  <rect class="chip" x="549" y="70" width="117" height="42" rx="5"/>
  <text class="s" x="607" y="96" text-anchor="middle">AAAB パターン</text>
  <rect class="chip" x="677" y="70" width="117" height="42" rx="5"/>
  <text class="s" x="735" y="89" text-anchor="middle">リズムと音程の</text>
  <text class="s" x="735" y="103" text-anchor="middle">相関</text>
  <rect class="chip" x="805" y="70" width="117" height="42" rx="5"/>
  <text class="s" x="863" y="96" text-anchor="middle">キャッチーさ</text>

  <path class="ln" d="M 95 112 V 134"/>
  <path class="ln" d="M 223 112 V 134"/>
  <path class="ln" d="M 351 112 V 134"/>
  <path class="ln" d="M 479 112 V 134"/>
  <path class="ln" d="M 607 112 V 134"/>
  <path class="ln" d="M 735 112 V 134"/>
  <path class="ln" d="M 863 112 V 134"/>
  <path class="ln" d="M 95 134 H 863"/>
  <path class="ln" d="M 480 134 V 156" marker-end="url(#mels-a)"/>

  <rect class="chip" x="250" y="160" width="460" height="34" rx="5"/>
  <text class="s" x="480" y="181" text-anchor="middle">各次元にボーカルスタイル別の重みを掛ける</text>

  <path class="ln" d="M 480 194 V 214" marker-end="url(#mels-a)"/>

  <rect class="card" x="340" y="218" width="280" height="36" rx="6"/>
  <text class="h" x="480" y="241" text-anchor="middle">合計メロディスコア</text>

  <text class="s" x="480" y="272" text-anchor="middle">7 つの重みは合計 1.0 で、スタイルプリセットごとに変わります。アイドルは AAAB とキャッチーさ、ロックはサプライズ寄りです。</text>

  <path class="seam" d="M 24 294 H 936"/>
  <text class="s" x="480" y="314" text-anchor="middle">単独の次元でメロディが決まることはなく、候補の順位を決めるのは重み付きの合計です。</text>
</svg>
