<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" aria-labelledby="tbg-ttl tbg-dsc">
  <title id="tbg-ttl">How one bar of bass is built</title>
  <desc id="tbg-dsc">The bar's chord supplies a root and a chord function. A pattern is then chosen — automatically from the mood and section type, out of seventeen patterns, or pinned per section by the Blueprint's bass_style_hint where zero means auto. The root is only shifted by an octave when that is what keeps it inside the E1 to G3 bass range. Across the bar the root lands on beat 1, the middle beats follow the pattern, and the second half of beat 4 carries an approach note into the next bar's root — usually a fifth below, with a chromatic half step reserved for walking lines.</desc>

  <defs>
    <marker id="tbg-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="392" rx="12"/>

  <rect class="chip" x="24" y="68" width="160" height="60" rx="5"/>
  <text class="h" x="36" y="92">the bar's chord</text>
  <text class="s" x="36" y="110">root and chord function</text>

  <path class="ln" d="M 184 98 H 204" marker-end="url(#tbg-a)"/>

  <rect class="grp" x="208" y="44" width="340" height="140" rx="8"/>
  <text class="lbl" x="222" y="66">pattern choice</text>
  <rect class="chip" x="220" y="76" width="316" height="44" rx="5"/>
  <text class="h" x="232" y="97">auto: mood and section type</text>
  <text class="s" x="232" y="113">17 patterns, from whole notes to 16th runs</text>
  <rect class="alt" x="220" y="128" width="316" height="44" rx="6"/>
  <text class="mono" x="232" y="149">bass_style_hint</text>
  <text class="s" x="232" y="165">per section — 0 = auto, 1–17 pins a pattern</text>

  <path class="ln" d="M 548 114 H 568" marker-end="url(#tbg-a)"/>

  <rect class="chip" x="572" y="68" width="184" height="76" rx="5"/>
  <text class="h" x="584" y="90">octave, for range only</text>
  <text class="s" x="584" y="108">moved up or down purely</text>
  <text class="s" x="584" y="124">to stay inside E1–G3</text>

  <text class="s" x="772" y="90">The chord's function shapes</text>
  <text class="s" x="772" y="106">how the bass approaches the</text>
  <text class="s" x="772" y="122">next bar's root.</text>

  <path class="ln" d="M 664 144 V 194" marker-end="url(#tbg-a)"/>

  <rect class="grp" x="24" y="204" width="912" height="114" rx="8"/>
  <text class="lbl" x="38" y="226">one bar, four beats</text>

  <rect class="chip" x="36" y="236" width="165" height="70" rx="5"/>
  <text class="h" x="48" y="257">beat 1</text>
  <text class="s" x="48" y="275">the root lands here</text>

  <rect class="chip" x="213" y="236" width="165" height="70" rx="5"/>
  <text class="h" x="225" y="257">beat 2</text>
  <text class="s" x="225" y="275">pattern-dependent</text>

  <rect class="chip" x="390" y="236" width="165" height="70" rx="5"/>
  <text class="h" x="402" y="257">beat 3</text>
  <text class="s" x="402" y="275">pattern-dependent</text>

  <rect class="card" x="567" y="236" width="357" height="70" rx="6"/>
  <text class="h" x="579" y="257">beat 4, second half</text>
  <text class="s" x="579" y="275">an approach note into the next bar's root, usually</text>
  <text class="s" x="579" y="291">a 5th below; a chromatic half step in walking lines</text>

  <path class="seam" d="M 24 346 H 936"/>
  <text class="s" x="480" y="368" text-anchor="middle">Section type steers which pattern is used; the octave only ever moves to keep the note playable.</text>
</svg>
