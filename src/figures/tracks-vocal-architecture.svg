<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" role="img" aria-labelledby="tva-ttl tva-dsc">
  <title id="tva-ttl">How the three vocal components fit together</title>
  <desc id="tva-dsc">A left-to-right pipeline. VocalStyleProfile sits on the left and supplies two things: a StyleBias that shapes which notes get generated, and an EvaluatorConfig that weights how candidates are judged. MelodyDesigner in the middle generates a batch of candidate phrases, scores each one, culls the bottom half and then picks probabilistically from what remains. The Vocal Generator on the right runs the constraint pipeline, stores the phrase in a cache keyed on section type, bar count and starting chord degree, and writes the result to the vocal track.</desc>

  <defs>
    <marker id="tva-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="364" rx="12"/>

  <rect class="grp" x="24" y="40" width="210" height="250" rx="8"/>
  <text class="lbl" x="38" y="62">per vocal style</text>
  <rect class="card" x="34" y="72" width="190" height="30" rx="6"/>
  <text class="mono" x="129" y="91" text-anchor="middle">VocalStyleProfile</text>
  <rect class="chip" x="34" y="112" width="190" height="54" rx="5"/>
  <text class="mono" x="46" y="132">StyleBias</text>
  <text class="s" x="46" y="152">shapes what gets written</text>
  <rect class="chip" x="34" y="176" width="190" height="54" rx="5"/>
  <text class="mono" x="46" y="196">EvaluatorConfig</text>
  <text class="s" x="46" y="216">weights how it is judged</text>
  <text class="s" x="34" y="252">One profile per style keeps</text>
  <text class="s" x="34" y="268">generation and scoring in step.</text>

  <path class="ln" d="M 234 165 H 254" marker-end="url(#tva-a)"/>

  <rect class="grp" x="258" y="40" width="372" height="250" rx="8"/>
  <text class="lbl" x="272" y="62">MelodyDesigner</text>

  <rect class="chip" x="270" y="72" width="348" height="52" rx="5"/>
  <text class="h" x="282" y="93">generate candidates</text>
  <text class="s" x="282" y="112">chorus 100 · B 50 · bridge 30 · elsewhere 20</text>

  <path class="ln" d="M 444 124 V 134" marker-end="url(#tva-a)"/>

  <rect class="chip" x="270" y="138" width="348" height="64" rx="5"/>
  <text class="lbl" x="282" y="158">score each candidate</text>
  <text class="s" x="282" y="177">style 40% · culling 40% · bias 20%</text>
  <text class="s" x="282" y="193">plus a global-motif bonus weighted by section</text>

  <path class="ln" d="M 444 202 V 212" marker-end="url(#tva-a)"/>

  <rect class="chip" x="270" y="216" width="348" height="62" rx="5"/>
  <text class="h" x="282" y="237">keep the top half, then pick by weight</text>
  <text class="s" x="282" y="256">the top-scoring candidate is a fallback,</text>
  <text class="s" x="282" y="272">not an automatic winner</text>

  <path class="ln" d="M 630 165 H 650" marker-end="url(#tva-a)"/>

  <rect class="grp" x="654" y="40" width="282" height="250" rx="8"/>
  <text class="lbl" x="668" y="62">Vocal Generator</text>

  <rect class="chip" x="666" y="72" width="258" height="66" rx="5"/>
  <text class="h" x="678" y="93">constraint pipeline</text>
  <text class="s" x="678" y="112">voice leading, safe pitch,</text>
  <text class="s" x="678" y="128">octave fold into range</text>

  <path class="ln" d="M 795 138 V 148" marker-end="url(#tva-a)"/>

  <rect class="chip" x="666" y="152" width="258" height="66" rx="5"/>
  <text class="h" x="678" y="173">phrase cache</text>
  <text class="s" x="678" y="192">keyed on section type, bar count</text>
  <text class="s" x="678" y="208">and starting chord degree</text>

  <path class="ln" d="M 795 218 V 228" marker-end="url(#tva-a)"/>

  <rect class="chip" x="666" y="232" width="258" height="46" rx="5"/>
  <text class="h" x="678" y="253">write to the vocal track</text>
  <text class="s" x="678" y="270">one MidiTrack, channel 0</text>

  <path class="seam" d="M 24 318 H 936"/>
  <text class="s" x="480" y="340" text-anchor="middle">The profile is read twice — once to bias what is generated, once to weight what survives.</text>
</svg>
