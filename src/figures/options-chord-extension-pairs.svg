<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" role="img" aria-labelledby="oce-ttl oce-dsc">
  <title id="oce-ttl">Each chord-extension flag gates its own probability</title>
  <desc id="oce-dsc">Four independent pairs laid out in a two-by-two grid. chordExtSus feeds chordExtSusProb with a default of 0.2, chordExt7th feeds chordExt7thProb at 0.15, chordExt9th feeds chordExt9thProb at 0.25, and chordExtTritoneSub feeds chordExtTritoneSubProb at 0.5. The four pairs do not interact: a probability is read only while its own flag is true.</desc>

  <defs>
    <marker id="oce-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="210" rx="12"/>

  <rect class="grp" x="24" y="36" width="912" height="150" rx="8"/>
  <text class="lbl" x="36" y="56">enable flag → probability (SongConfig default)</text>

  <rect class="chip" x="36" y="66" width="190" height="30" rx="5"/>
  <text class="mono" x="131" y="86" text-anchor="middle">chordExtSus</text>
  <path class="ln" d="M 226 81 H 248" marker-end="url(#oce-a)"/>
  <rect class="chip" x="254" y="66" width="212" height="30" rx="5"/>
  <text class="mono" x="266" y="86">chordExtSusProb</text>
  <text class="s" x="454" y="86" text-anchor="end">0.2</text>

  <rect class="chip" x="490" y="66" width="190" height="30" rx="5"/>
  <text class="mono" x="585" y="86" text-anchor="middle">chordExt7th</text>
  <path class="ln" d="M 680 81 H 702" marker-end="url(#oce-a)"/>
  <rect class="chip" x="708" y="66" width="212" height="30" rx="5"/>
  <text class="mono" x="720" y="86">chordExt7thProb</text>
  <text class="s" x="908" y="86" text-anchor="end">0.15</text>

  <rect class="chip" x="36" y="106" width="190" height="30" rx="5"/>
  <text class="mono" x="131" y="126" text-anchor="middle">chordExt9th</text>
  <path class="ln" d="M 226 121 H 248" marker-end="url(#oce-a)"/>
  <rect class="chip" x="254" y="106" width="212" height="30" rx="5"/>
  <text class="mono" x="266" y="126">chordExt9thProb</text>
  <text class="s" x="454" y="126" text-anchor="end">0.25</text>

  <rect class="chip" x="490" y="106" width="190" height="30" rx="5"/>
  <text class="mono" x="585" y="126" text-anchor="middle">chordExtTritoneSub</text>
  <path class="ln" d="M 680 121 H 702" marker-end="url(#oce-a)"/>
  <rect class="chip" x="708" y="106" width="212" height="30" rx="5"/>
  <text class="mono" x="720" y="126">chordExtTritoneSubProb</text>
  <text class="s" x="908" y="126" text-anchor="end">0.5</text>

  <text class="s" x="480" y="168" text-anchor="middle">The flags are independent — each probability is read only while its own flag is true.</text>
</svg>
