<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" role="img" aria-labelledby="vfi-ttl vfi-dsc">
  <title id="vfi-ttl">ボーカルファーストの反復 — メロディを試して、納得してから伴奏へ</title>
  <desc id="vfi-dsc">左から右へのループです。generateVocal が最初のテイクを書き、それを試聴します。気に入らなければ regenerateVocal が新しいシードや VocalConfig で別のテイクを作り、試聴に戻ります。メロディを採用してはじめて generateAccompaniment がそのメロディに合わせた伴奏を書き、MIDI として書き出します。generateWithVocal を使えば、同じボーカル優先の順序を反復なしの 1 回の呼び出しで実行できます。</desc>

  <defs>
    <marker id="vfi-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="vfi-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="306" rx="12"/>

  <rect class="grp" x="24" y="48" width="560" height="152" rx="8"/>
  <text class="lbl" x="38" y="70">メロディを詰める</text>

  <rect class="chip" x="40" y="84" width="160" height="44" rx="5"/>
  <text class="mono" x="120" y="104" text-anchor="middle">generateVocal</text>
  <text class="s" x="120" y="120" text-anchor="middle">最初のテイク</text>

  <path class="ln" d="M 200 106 H 222" marker-end="url(#vfi-a)"/>

  <rect class="chip" x="226" y="84" width="150" height="44" rx="5"/>
  <text class="h" x="301" y="104" text-anchor="middle">プレビュー</text>
  <text class="s" x="301" y="120" text-anchor="middle">試聴とピアノロール</text>

  <path class="ln" d="M 376 106 H 398" marker-end="url(#vfi-a)"/>

  <rect class="chip" x="402" y="84" width="150" height="44" rx="5"/>
  <text class="h" x="477" y="104" text-anchor="middle">納得できた？</text>
  <text class="s" x="477" y="120" text-anchor="middle">採用か作り直しか</text>

  <path class="lnd" d="M 477 128 V 168 H 400" marker-end="url(#vfi-a)"/>
  <text class="s" x="486" y="152">いいえ</text>

  <rect class="chip" x="206" y="148" width="190" height="40" rx="5"/>
  <text class="mono" x="301" y="166" text-anchor="middle">regenerateVocal</text>
  <text class="s" x="301" y="182" text-anchor="middle">新しいシードか VocalConfig</text>

  <path class="lnd" d="M 301 148 V 131" marker-end="url(#vfi-a)"/>

  <path class="ln" d="M 552 106 H 596" marker-end="url(#vfi-a)"/>
  <text class="s" x="560" y="98">はい</text>

  <rect class="grp" x="600" y="48" width="336" height="152" rx="8"/>
  <text class="lbl" x="614" y="70">確定</text>

  <rect class="card" x="616" y="84" width="304" height="44" rx="6"/>
  <text class="mono" x="768" y="104" text-anchor="middle">generateAccompaniment</text>
  <text class="s" x="768" y="120" text-anchor="middle">伴奏はそのメロディに合わせる</text>

  <path class="ln" d="M 768 128 V 140" marker-end="url(#vfi-a)"/>

  <rect class="chip" x="616" y="144" width="304" height="44" rx="5"/>
  <text class="h" x="768" y="164" text-anchor="middle">MIDI 書き出し</text>
  <text class="mono" x="768" y="180" text-anchor="middle">getMidi()</text>

  <rect class="alt" x="24" y="214" width="912" height="36" rx="6"/>
  <text class="lbl" x="40" y="236">ワンショットの代替</text>
  <text class="mono" x="168" y="236">generateWithVocal</text>
  <path class="ln2" d="M 288 231 H 306" marker-end="url(#vfi-b)"/>
  <text class="s" x="316" y="236">同じボーカル優先の順序を、反復なしの 1 回の呼び出しで実行します</text>

  <path class="seam" d="M 24 270 H 936"/>
  <text class="s" x="480" y="290" text-anchor="middle">やり直しの代償はメロディだけ。伴奏は採用したテイクに対して一度だけ書かれます。</text>
</svg>
