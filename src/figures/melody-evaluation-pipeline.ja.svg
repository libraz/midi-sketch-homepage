<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 438" role="img" aria-labelledby="melp-ttl melp-dsc">
  <title id="melp-ttl">メロディ評価パイプライン全体 — 候補生成から事後レポートまで</title>
  <desc id="melp-dsc">5 つの段階を 2 段組みで示します。生成ではセクションごとに 20〜100 個の候補を作ります。カリングスコアは 1.0 から始め、スタイルに応じた 9 種のペナルティを引き、2 つのボーナスを加えます。スコアリングでは 7 次元を評価し、ボーカルスタイル別の重みを掛けます。選択では 2 つのスコアと音程バイアスを合成して並べ替え、下位半分を除外したうえで残りから抽選します。事後分析は任意実行の不協和音レポートで、音そのものは書き換えません。</desc>

  <defs>
    <marker id="melp-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="438" rx="12"/>

  <rect class="grp" x="24" y="44" width="288" height="150" rx="8"/>
  <text class="lbl" x="38" y="66">1 · 生成</text>
  <rect class="chip" x="38" y="76" width="260" height="32" rx="5"/>
  <text class="h" x="168" y="97" text-anchor="middle">候補 20〜100 個</text>
  <text class="s" x="168" y="126" text-anchor="middle">サビ 100 / Bメロ 50</text>
  <text class="s" x="168" y="141" text-anchor="middle">ブリッジ・チャント 30 / その他 20</text>
  <rect class="chip" x="38" y="152" width="260" height="30" rx="5"/>
  <text class="s" x="168" y="171" text-anchor="middle">リズム・音高・音域制限・装飾</text>

  <path class="ln" d="M 312 119 H 328" marker-end="url(#melp-a)"/>

  <rect class="grp" x="330" y="44" width="288" height="150" rx="8"/>
  <text class="lbl" x="344" y="66">2 · カリングスコア</text>
  <rect class="chip" x="344" y="76" width="260" height="28" rx="5"/>
  <text class="h" x="356" y="95">1.0 から開始</text>
  <text class="s" x="356" y="120">−  9 種のペナルティ（スタイル依存）</text>
  <text class="s" x="356" y="138">+  明確なピーク・モチーフ反復</text>
  <path class="rule" d="M 344 147 H 604"/>
  <rect class="chip" x="344" y="153" width="260" height="28" rx="5"/>
  <text class="s" x="356" y="171">=  カリングスコア 0.0〜1.0</text>

  <path class="ln" d="M 618 119 H 634" marker-end="url(#melp-a)"/>

  <rect class="grp" x="636" y="44" width="300" height="150" rx="8"/>
  <text class="lbl" x="650" y="66">3 · スコアリング</text>
  <rect class="chip" x="650" y="76" width="272" height="28" rx="5"/>
  <text class="h" x="662" y="95">7 次元</text>
  <text class="s" x="662" y="122">歌いやすさ・コードトーン率・輪郭形状</text>
  <text class="s" x="662" y="138">サプライズ・AAAB・リズム相関・キャッチーさ</text>
  <rect class="chip" x="650" y="150" width="272" height="30" rx="5"/>
  <text class="s" x="662" y="169">ボーカルスタイル別に重み付け</text>

  <path class="ln" d="M 786 194 V 208 H 250 V 219" marker-end="url(#melp-a)"/>

  <rect class="grp" x="24" y="222" width="452" height="150" rx="8"/>
  <text class="lbl" x="38" y="244">4 · 選択</text>
  <rect class="chip" x="38" y="254" width="424" height="44" rx="5"/>
  <text class="s" x="250" y="274" text-anchor="middle">合成 = スタイル 40% + カリング 40% + 音程バイアス 20%</text>
  <text class="s" x="250" y="289" text-anchor="middle">さらにセクション別の重みでグローバルモチーフ加点</text>
  <text class="s" x="250" y="318" text-anchor="middle">スコア順に並べ、下位半分を除外</text>
  <rect class="card" x="38" y="328" width="424" height="32" rx="6"/>
  <text class="h" x="250" y="349" text-anchor="middle">上位半分から重み付きランダムで 1 本</text>

  <path class="ln" d="M 476 297 H 492" marker-end="url(#melp-a)"/>

  <rect class="grp" x="494" y="222" width="442" height="150" rx="8"/>
  <text class="lbl" x="508" y="244">5 · 事後分析</text>
  <rect class="chip" x="508" y="254" width="414" height="30" rx="5"/>
  <text class="s" x="715" y="273" text-anchor="middle">不協和音アナライザーが完成した曲を走査</text>
  <text class="s" x="715" y="304" text-anchor="middle">同時衝突・非コードトーン・コード変化後の持続・</text>
  <text class="s" x="715" y="319" text-anchor="middle">非ダイアトニック音を High / Medium / Low で判定</text>
  <rect class="chip" x="508" y="330" width="414" height="30" rx="5"/>
  <text class="mono" x="558" y="349">--analyze</text>
  <text class="s" x="636" y="349">レポートを出すだけで曲は変わりません</text>

  <path class="seam" d="M 24 396 H 936"/>
  <text class="s" x="480" y="416" text-anchor="middle">候補が実際に消えるのは選択の段階だけで、アナライザーは選ばれ済みのメロディを報告するだけです。</text>
</svg>
