<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 156" role="img" aria-labelledby="ohu-ttl ohu-dsc">
  <title id="ohu-ttl">humanize が 2 つの揺れ量を制御する</title>
  <desc id="ohu-dsc">既定でオフの humanize スイッチが、2 つの量のフィールドにつながります。humanizeTiming は既定 0.4、humanizeVelocity は既定 0.3 です。右の注記のとおり、SongConfig と AccompanimentConfig はどちらもこれらを 0.0〜1.0 の float として扱います。</desc>

  <defs>
    <marker id="ohu-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="156" rx="12"/>

  <text class="lbl" x="26" y="62">スイッチ</text>
  <rect class="card" x="24" y="70" width="180" height="48" rx="6"/>
  <text class="mono" x="114" y="92" text-anchor="middle">humanize</text>
  <text class="s" x="114" y="110" text-anchor="middle">既定は false</text>

  <path class="ln" d="M 204 94 H 214 V 76 H 228" marker-end="url(#ohu-a)"/>
  <path class="ln" d="M 204 94 H 214 V 116 H 228" marker-end="url(#ohu-a)"/>

  <rect class="chip" x="232" y="60" width="340" height="32" rx="5"/>
  <text class="mono" x="244" y="80">humanizeTiming</text>
  <text class="s" x="372" y="80">0.0–1.0、既定 0.4</text>
  <rect class="chip" x="232" y="100" width="340" height="32" rx="5"/>
  <text class="mono" x="244" y="120">humanizeVelocity</text>
  <text class="s" x="372" y="120">0.0–1.0、既定 0.3</text>

  <rect class="chip" x="596" y="60" width="340" height="72" rx="5"/>
  <text class="lbl" x="610" y="80">スケールは 1 つ</text>
  <text class="s" x="610" y="100">SongConfig と AccompanimentConfig は</text>
  <text class="s" x="610" y="118">どちらも 0.0–1.0 の float です。</text>
</svg>
