<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" role="img" aria-labelledby="vfg-ttl vfg-dsc">
  <title id="vfg-ttl">ボーカル先行生成 — 伴奏を書く前にメロディを確定させる流れ</title>
  <desc id="vfg-dsc">ボーカル先行ワークフローの上から下への流れです。SongConfig が generateVocal に入り、楽曲構成と予定コード進行を組み立ててからボーカルだけを書きます。regenerateVocal を何度でも呼んで別テイクを試せます。メロディを採用したら generateAccompaniment が Aux・モチーフ・ベース・コード・ギター・アルペジオ・ドラム・SE の 8 パートをボーカル抜きで書き、後処理と、伴奏とぶつかるボーカル音を直す最終調整を行います。完成した Song は MidiWriter を通って SMF Type 1 として出力されます。</desc>

  <defs>
    <marker id="vfg-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="404" rx="12"/>

  <rect class="grp" x="24" y="150" width="150" height="68" rx="8"/>
  <text class="lbl" x="36" y="170">入力</text>
  <rect class="chip" x="34" y="180" width="130" height="28" rx="5"/>
  <text class="mono" x="99" y="198" text-anchor="middle">SongConfig</text>

  <path class="ln" d="M 174 194 H 196" marker-end="url(#vfg-a)"/>

  <rect class="grp" x="198" y="44" width="520" height="308" rx="8"/>
  <text class="lbl" x="212" y="66">ボーカル先行ワークフロー</text>

  <rect class="chip" x="212" y="78" width="492" height="32" rx="5"/>
  <text class="h" x="224" y="99">generateVocal</text>
  <text class="s" x="330" y="99">構成とコード進行を先に決め、メロディだけを書く</text>

  <path class="ln" d="M 338 110 V 124" marker-end="url(#vfg-a)"/>

  <rect class="card" x="212" y="128" width="252" height="44" rx="6"/>
  <text class="h" x="338" y="148" text-anchor="middle">ボーカルトラック</text>
  <text class="s" x="338" y="164" text-anchor="middle">メロディはここで確定</text>

  <path class="ln" d="M 464 142 H 486" marker-end="url(#vfg-a)"/>
  <path class="lnd" d="M 486 158 H 466" marker-end="url(#vfg-a)"/>

  <rect class="chip" x="488" y="128" width="216" height="44" rx="5"/>
  <text class="mono" x="596" y="148" text-anchor="middle">regenerateVocal</text>
  <text class="s" x="596" y="164" text-anchor="middle">構成はそのまま別テイク</text>

  <path class="ln" d="M 338 172 V 184" marker-end="url(#vfg-a)"/>

  <rect class="chip" x="212" y="188" width="492" height="94" rx="5"/>
  <text class="mono" x="224" y="207">generateAccompaniment</text>
  <text class="s" x="372" y="207">ボーカルは飛ばし、順序はパラダイム次第</text>
  <rect class="chip" x="224" y="214" width="111" height="26" rx="5"/>
  <text class="s" x="280" y="231" text-anchor="middle">1 · Aux</text>
  <rect class="chip" x="343" y="214" width="111" height="26" rx="5"/>
  <text class="s" x="399" y="231" text-anchor="middle">2 · モチーフ</text>
  <rect class="chip" x="462" y="214" width="111" height="26" rx="5"/>
  <text class="s" x="518" y="231" text-anchor="middle">3 · ベース</text>
  <rect class="chip" x="581" y="214" width="111" height="26" rx="5"/>
  <text class="s" x="637" y="231" text-anchor="middle">4 · コード</text>
  <rect class="chip" x="224" y="248" width="111" height="26" rx="5"/>
  <text class="s" x="280" y="265" text-anchor="middle">5 · ギター</text>
  <rect class="chip" x="343" y="248" width="111" height="26" rx="5"/>
  <text class="s" x="399" y="265" text-anchor="middle">6 · アルペジオ</text>
  <rect class="chip" x="462" y="248" width="111" height="26" rx="5"/>
  <text class="s" x="518" y="265" text-anchor="middle">7 · ドラム</text>
  <rect class="chip" x="581" y="248" width="111" height="26" rx="5"/>
  <text class="s" x="637" y="265" text-anchor="middle">8 · SE</text>

  <path class="ln" d="M 458 282 V 294" marker-end="url(#vfg-a)"/>

  <rect class="chip" x="212" y="298" width="246" height="32" rx="5"/>
  <text class="s" x="335" y="318" text-anchor="middle">レイヤー配置・遷移・ヒューマナイズ</text>
  <path class="ln" d="M 458 314 H 466" marker-end="url(#vfg-a)"/>
  <rect class="alt" x="470" y="298" width="234" height="32" rx="6"/>
  <text class="mono" x="587" y="318" text-anchor="middle">refineVocalForAccompaniment</text>

  <text class="s" x="458" y="344" text-anchor="middle">最後に伴奏とぶつかるボーカル音を最大 2 回まで直す</text>

  <path class="ln" d="M 718 235 H 726 V 150 H 736" marker-end="url(#vfg-a)"/>

  <rect class="chip" x="740" y="136" width="196" height="28" rx="5"/>
  <text class="h" x="838" y="155" text-anchor="middle">Song</text>
  <path class="ln" d="M 838 164 V 176" marker-end="url(#vfg-a)"/>
  <rect class="chip" x="740" y="180" width="196" height="28" rx="5"/>
  <text class="mono" x="838" y="199" text-anchor="middle">MidiWriter</text>
  <path class="ln" d="M 838 208 V 220" marker-end="url(#vfg-a)"/>
  <rect class="chip" x="740" y="224" width="196" height="28" rx="5"/>
  <text class="h" x="838" y="243" text-anchor="middle">SMF Type 1</text>
  <text class="s" x="838" y="268" text-anchor="middle">ボーカルは Ch 0、</text>
  <text class="s" x="838" y="282" text-anchor="middle">伴奏も各自のチャンネル</text>

  <path class="seam" d="M 24 368 H 936"/>
  <text class="s" x="480" y="388" text-anchor="middle">メロディは伴奏より先に確定し、最後の微調整だけがもう一度そこに触れます。</text>
</svg>
