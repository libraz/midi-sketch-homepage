<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="mlr-ttl mlr-dsc">
  <title id="mlr-ttl">MelodyLead — 生成されるトラックとそれぞれの役割</title>
  <desc id="mlr-dsc">5 つのトラックがミックスに集まります。ボーカルがリード、Aux が副旋律を担い、コード・ベース・ドラムがハーモニーの土台、低音の土台、リズムを受け持ちます。モチーフはアレンジ上必要な場合にだけ生成され、ギターとアルペジオはそれぞれの有効化フラグに従います。</desc>

  <defs>
    <marker id="mlr-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="250" rx="12"/>

  <text class="lbl" x="36" y="46">生成されるトラック</text>

  <rect class="card" x="36" y="56" width="169" height="44" rx="6"/>
  <text class="h" x="120" y="77" text-anchor="middle">ボーカル</text>
  <text class="s" x="120" y="93" text-anchor="middle">リード</text>

  <rect class="chip" x="215" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="299" y="77" text-anchor="middle">Aux</text>
  <text class="s" x="299" y="93" text-anchor="middle">副旋律</text>

  <rect class="chip" x="394" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="478" y="77" text-anchor="middle">コード</text>
  <text class="s" x="478" y="93" text-anchor="middle">ハーモニーの土台</text>

  <rect class="chip" x="573" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="657" y="77" text-anchor="middle">ベース</text>
  <text class="s" x="657" y="93" text-anchor="middle">低音の土台</text>

  <rect class="chip" x="752" y="56" width="169" height="44" rx="5"/>
  <text class="h" x="836" y="77" text-anchor="middle">ドラム</text>
  <text class="s" x="836" y="93" text-anchor="middle">リズム</text>

  <path class="ln" d="M 120 102 V 122" marker-end="url(#mlr-a)"/>
  <path class="ln" d="M 299 102 V 122" marker-end="url(#mlr-a)"/>
  <path class="ln" d="M 478 102 V 122" marker-end="url(#mlr-a)"/>
  <path class="ln" d="M 657 102 V 122" marker-end="url(#mlr-a)"/>
  <path class="ln" d="M 836 102 V 122" marker-end="url(#mlr-a)"/>

  <rect class="chip" x="36" y="124" width="888" height="36" rx="5"/>
  <text class="h" x="480" y="147" text-anchor="middle">ミックス</text>

  <rect class="alt" x="36" y="176" width="336" height="28" rx="6"/>
  <text class="s" x="204" y="195" text-anchor="middle">Motif — 必要な場合にだけ生成</text>
  <text class="s" x="390" y="195">ギターとアルペジオは各自の有効化フラグ次第</text>

  <path class="seam" d="M 24 214 H 936"/>
  <text class="s" x="480" y="234" text-anchor="middle">ボーカルトラックを残すのは MelodyLead だけで、伴奏はそのメロディを取り囲むように書かれます。</text>
</svg>
