<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="sg-ttl sg-dsc">
  <title id="sg-ttl">標準生成 — パラメータから標準 MIDI ファイルまで</title>
  <desc id="sg-dsc">左から右への流れです。GeneratorParams と SongConfig が Generator に入り、まず楽曲構成を組み立て、続いてボーカル・Aux・モチーフ・ベース・コード・ギター・アルペジオ・ドラム・SE の 9 パートを決まった順に書き、最後に遷移ダイナミクスとヒューマナイズを適用します。完成した Song は MidiWriter に渡され、パートごとに 1 トラックを持つ SMF Type 1 として出力されます。</desc>

  <defs>
    <marker id="sg-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="360" rx="12"/>

  <rect class="grp" x="24" y="116" width="150" height="104" rx="8"/>
  <text class="lbl" x="36" y="136">入力</text>
  <rect class="chip" x="34" y="146" width="130" height="28" rx="5"/>
  <text class="mono" x="99" y="164" text-anchor="middle">GeneratorParams</text>
  <rect class="chip" x="34" y="182" width="130" height="28" rx="5"/>
  <text class="mono" x="99" y="200" text-anchor="middle">SongConfig</text>

  <path class="ln" d="M 174 168 H 196" marker-end="url(#sg-a)"/>

  <rect class="grp" x="198" y="44" width="520" height="272" rx="8"/>
  <text class="lbl" x="212" y="66">Generator</text>

  <rect class="chip" x="212" y="78" width="492" height="32" rx="5"/>
  <text class="h" x="224" y="99">buildStructure</text>
  <text class="s" x="340" y="99">セクション順・小節数・コードの骨格を決める</text>

  <path class="ln" d="M 458 110 V 124" marker-end="url(#sg-a)"/>

  <rect class="chip" x="212" y="128" width="492" height="94" rx="5"/>
  <text class="lbl" x="224" y="147">トラック生成（この順）</text>
  <rect class="chip" x="224" y="154" width="86" height="26" rx="5"/>
  <text class="s" x="267" y="171" text-anchor="middle">1 · ボーカル</text>
  <rect class="chip" x="318" y="154" width="86" height="26" rx="5"/>
  <text class="s" x="361" y="171" text-anchor="middle">2 · Aux</text>
  <rect class="chip" x="412" y="154" width="86" height="26" rx="5"/>
  <text class="s" x="455" y="171" text-anchor="middle">3 · モチーフ</text>
  <rect class="chip" x="506" y="154" width="86" height="26" rx="5"/>
  <text class="s" x="549" y="171" text-anchor="middle">4 · ベース</text>
  <rect class="chip" x="600" y="154" width="86" height="26" rx="5"/>
  <text class="s" x="643" y="171" text-anchor="middle">5 · コード</text>
  <rect class="chip" x="224" y="188" width="86" height="26" rx="5"/>
  <text class="s" x="267" y="205" text-anchor="middle">6 · ギター</text>
  <rect class="chip" x="318" y="188" width="86" height="26" rx="5"/>
  <text class="s" x="361" y="205" text-anchor="middle">7 · アルペジオ</text>
  <rect class="chip" x="412" y="188" width="86" height="26" rx="5"/>
  <text class="s" x="455" y="205" text-anchor="middle">8 · ドラム</text>
  <rect class="chip" x="506" y="188" width="86" height="26" rx="5"/>
  <text class="s" x="549" y="205" text-anchor="middle">9 · SE</text>

  <path class="ln" d="M 458 222 V 236" marker-end="url(#sg-a)"/>

  <rect class="chip" x="212" y="240" width="238" height="32" rx="5"/>
  <text class="s" x="331" y="260" text-anchor="middle">applyTransitionDynamics</text>
  <path class="ln" d="M 450 256 H 462" marker-end="url(#sg-a)"/>
  <rect class="chip" x="466" y="240" width="238" height="32" rx="5"/>
  <text class="s" x="585" y="260" text-anchor="middle">applyHumanization</text>

  <text class="s" x="458" y="296" text-anchor="middle">順序はパラダイム次第。RhythmSync はモチーフを先に書き、ボーカルをそれに合わせる</text>

  <path class="ln" d="M 718 168 H 726 V 130 H 736" marker-end="url(#sg-a)"/>

  <rect class="chip" x="740" y="116" width="196" height="28" rx="5"/>
  <text class="h" x="838" y="135" text-anchor="middle">Song</text>
  <path class="ln" d="M 838 144 V 156" marker-end="url(#sg-a)"/>
  <rect class="card" x="740" y="160" width="196" height="28" rx="6"/>
  <text class="mono" x="838" y="179" text-anchor="middle">MidiWriter</text>
  <path class="ln" d="M 838 188 V 200" marker-end="url(#sg-a)"/>
  <rect class="chip" x="740" y="204" width="196" height="28" rx="5"/>
  <text class="h" x="838" y="223" text-anchor="middle">SMF Type 1</text>
  <text class="s" x="838" y="248" text-anchor="middle">パートごとに 1 トラック、</text>
  <text class="s" x="838" y="262" text-anchor="middle">それぞれ専用の MIDI チャンネル</text>

  <path class="seam" d="M 24 326 H 936"/>
  <text class="s" x="480" y="346" text-anchor="middle">各パートは先に置かれたパートを参照して書かれ、MidiWriter が走るまでファイルは書き出されません。</text>
</svg>
