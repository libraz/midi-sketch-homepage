<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="bas-ttl bas-dsc">
  <title id="bas-ttl">The decisions behind one bar of bass</title>
  <desc id="bas-dsc">A bar of bass starts from the root of its chord. When a vocal is already in place, the bass picks a motion against it and pushes any unison an octave down. The section type then decides which bass pattern is played and how hard. The pattern itself lays down the notes, adding approach notes that lead into the next bar's root, and every fourth bar takes a small variation.</desc>

  <defs>
    <marker id="bas-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="280" rx="12"/>

  <rect class="chip" x="24" y="110" width="160" height="48" rx="5"/>
  <text class="h" x="104" y="132" text-anchor="middle">root note</text>
  <text class="s" x="104" y="150" text-anchor="middle">from this bar's chord</text>

  <path class="ln" d="M 184 134 H 202" marker-end="url(#bas-a)"/>

  <rect class="grp" x="206" y="88" width="232" height="92" rx="8"/>
  <text class="lbl" x="218" y="108">when a vocal is there</text>
  <rect class="chip" x="218" y="114" width="208" height="28" rx="5"/>
  <text class="s" x="322" y="132" text-anchor="middle">motion chosen against it</text>
  <rect class="chip" x="218" y="148" width="208" height="28" rx="5"/>
  <text class="s" x="322" y="166" text-anchor="middle">unisons pushed an octave down</text>

  <path class="ln" d="M 438 134 H 456" marker-end="url(#bas-a)"/>

  <rect class="grp" x="460" y="88" width="250" height="92" rx="8"/>
  <text class="lbl" x="472" y="108">the section decides</text>
  <rect class="chip" x="472" y="114" width="226" height="28" rx="5"/>
  <text class="s" x="585" y="132" text-anchor="middle">which of the bass patterns</text>
  <rect class="chip" x="472" y="148" width="226" height="28" rx="5"/>
  <text class="s" x="585" y="166" text-anchor="middle">and how hard it is played</text>

  <path class="ln" d="M 710 134 H 722 V 120 H 728" marker-end="url(#bas-a)"/>

  <rect class="card" x="732" y="104" width="204" height="32" rx="6"/>
  <text class="h" x="834" y="125" text-anchor="middle">the pattern plays it</text>

  <path class="ln" d="M 834 136 V 148" marker-end="url(#bas-a)"/>

  <rect class="chip" x="732" y="152" width="204" height="44" rx="5"/>
  <text class="s" x="834" y="170" text-anchor="middle">approach notes lead into</text>
  <text class="s" x="834" y="186" text-anchor="middle">the next bar's root</text>

  <text class="s" x="480" y="222" text-anchor="middle">Every fourth bar takes a micro-variation — a rest, an octave jump, an extra approach note, or nothing.</text>

  <path class="seam" d="M 24 246 H 936"/>
  <text class="s" x="480" y="266" text-anchor="middle">Bass answers to the vocal first and to the section second; the pattern decides the rest.</text>
</svg>
