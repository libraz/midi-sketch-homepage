<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 438" role="img" aria-labelledby="melp-ttl melp-dsc">
  <title id="melp-ttl">The whole melody evaluation pipeline, from candidates to the finished report</title>
  <desc id="melp-dsc">Five stages laid out in two rows. Generation makes twenty to a hundred candidates per section. The culling score starts each candidate at 1.0, subtracts nine style-aware penalties and adds two bonuses. Scoring rates seven dimensions and weights them by the vocal style. Selection blends the two scores with an interval bias, sorts, drops the bottom half and draws a winner at random from the rest. Post-analysis is an opt-in dissonance report that never rewrites the music.</desc>

  <defs>
    <marker id="melp-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="438" rx="12"/>

  <rect class="grp" x="24" y="44" width="288" height="150" rx="8"/>
  <text class="lbl" x="38" y="66">1 · generation</text>
  <rect class="chip" x="38" y="76" width="260" height="32" rx="5"/>
  <text class="h" x="168" y="97" text-anchor="middle">20–100 candidates</text>
  <text class="s" x="168" y="126" text-anchor="middle">chorus 100 · pre-chorus 50</text>
  <text class="s" x="168" y="141" text-anchor="middle">bridge and chant 30 · rest 20</text>
  <rect class="chip" x="38" y="152" width="260" height="30" rx="5"/>
  <text class="s" x="168" y="171" text-anchor="middle">rhythm · pitch · limits · ornaments</text>

  <path class="ln" d="M 312 119 H 328" marker-end="url(#melp-a)"/>

  <rect class="grp" x="330" y="44" width="288" height="150" rx="8"/>
  <text class="lbl" x="344" y="66">2 · culling score</text>
  <rect class="chip" x="344" y="76" width="260" height="28" rx="5"/>
  <text class="h" x="356" y="95">start at 1.0</text>
  <text class="s" x="356" y="120">−  nine penalties, style-aware</text>
  <text class="s" x="356" y="138">+  clear peak, motif repeat</text>
  <path class="rule" d="M 344 147 H 604"/>
  <rect class="chip" x="344" y="153" width="260" height="28" rx="5"/>
  <text class="s" x="356" y="171">=  culling score 0.0–1.0</text>

  <path class="ln" d="M 618 119 H 634" marker-end="url(#melp-a)"/>

  <rect class="grp" x="636" y="44" width="300" height="150" rx="8"/>
  <text class="lbl" x="650" y="66">3 · scoring</text>
  <rect class="chip" x="650" y="76" width="272" height="28" rx="5"/>
  <text class="h" x="662" y="95">seven dimensions</text>
  <text class="s" x="662" y="122">singability, chord tone, contour,</text>
  <text class="s" x="662" y="138">surprise, AAAB, rhythm, catchiness</text>
  <rect class="chip" x="650" y="150" width="272" height="30" rx="5"/>
  <text class="s" x="662" y="169">weighted by the vocal style</text>

  <path class="ln" d="M 786 194 V 208 H 250 V 219" marker-end="url(#melp-a)"/>

  <rect class="grp" x="24" y="222" width="452" height="150" rx="8"/>
  <text class="lbl" x="38" y="244">4 · selection</text>
  <rect class="chip" x="38" y="254" width="424" height="44" rx="5"/>
  <text class="s" x="250" y="274" text-anchor="middle">combined = 40% style + 40% culling + 20% interval bias</text>
  <text class="s" x="250" y="289" text-anchor="middle">plus a global-motif bonus, weighted by section</text>
  <text class="s" x="250" y="318" text-anchor="middle">sorted by score, the bottom half is culled</text>
  <rect class="card" x="38" y="328" width="424" height="32" rx="6"/>
  <text class="h" x="250" y="349" text-anchor="middle">weighted random pick from the top half</text>

  <path class="ln" d="M 476 297 H 492" marker-end="url(#melp-a)"/>

  <rect class="grp" x="494" y="222" width="442" height="150" rx="8"/>
  <text class="lbl" x="508" y="244">5 · post-analysis</text>
  <rect class="chip" x="508" y="254" width="414" height="30" rx="5"/>
  <text class="s" x="715" y="273" text-anchor="middle">Dissonance Analyzer reads the finished song</text>
  <text class="s" x="715" y="304" text-anchor="middle">clashes, non-chord tones, sustains over a change,</text>
  <text class="s" x="715" y="319" text-anchor="middle">non-diatonic notes — each rated high, medium or low</text>
  <rect class="chip" x="508" y="330" width="414" height="30" rx="5"/>
  <text class="mono" x="558" y="349">--analyze</text>
  <text class="s" x="636" y="349">prints the report; nothing is rewritten</text>

  <path class="seam" d="M 24 396 H 936"/>
  <text class="s" x="480" y="416" text-anchor="middle">Selection is where candidates actually disappear; the analyzer only reports on the melody that was already chosen.</text>
</svg>
