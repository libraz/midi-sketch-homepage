<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="aux-ttl aux-dsc">
  <title id="aux-ttl">Aux が機能・音域・音を決めるまで</title>
  <desc id="aux-dsc">Aux 生成には 2 つの入力があります。演奏する機能を指定する Blueprint の AuxProfile と、ボーカルの解析結果です。セクションの種類によって、プロファイルのどの機能を使うか、どれだけ低く・どれだけ密に置くかが決まります。イントロ・バース・サビにそれぞれ設定があります。出てきた音は最後にボーカルと突き合わせられ、真上のボーカル音による音ごとの上限、衝突と孤立音の処理、そして跳びすぎたりコード外になった音を捨てる判定を通ります。</desc>

  <defs>
    <marker id="aux-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="312" rx="12"/>

  <rect class="card" x="24" y="64" width="176" height="44" rx="6"/>
  <text class="mono" x="112" y="86" text-anchor="middle">AuxProfile</text>
  <text class="s" x="112" y="102" text-anchor="middle">Blueprint から</text>

  <rect class="chip" x="24" y="128" width="176" height="44" rx="5"/>
  <text class="h" x="112" y="150" text-anchor="middle">ボーカル解析</text>
  <text class="s" x="112" y="166" text-anchor="middle">フレーズ・音高・休符</text>

  <path class="ln" d="M 200 86 H 224" marker-end="url(#aux-a)"/>
  <path class="ln" d="M 200 150 H 224" marker-end="url(#aux-a)"/>

  <rect class="grp" x="232" y="44" width="430" height="210" rx="8"/>
  <text class="lbl" x="246" y="64">セクション → 機能・音域・密度</text>

  <rect class="chip" x="246" y="76" width="402" height="32" rx="5"/>
  <text class="h" x="258" y="96">イントロ</text>
  <text class="s" x="322" y="96">イントロ機能。サビのモチーフの予告になることも</text>

  <rect class="chip" x="246" y="124" width="402" height="32" rx="5"/>
  <text class="h" x="258" y="144">A・B・ブリッジ</text>
  <text class="s" x="368" y="144">バース機能。ボーカルの 1 オクターブ下</text>

  <rect class="chip" x="246" y="172" width="402" height="32" rx="5"/>
  <text class="h" x="258" y="192">サビ</text>
  <text class="s" x="296" y="192">サビ機能。ボーカルに近い音域で密度も上げる</text>

  <text class="s" x="246" y="232">機能そのものは Blueprint 側で決まります</text>

  <path class="ln" d="M 662 150 H 686" marker-end="url(#aux-a)"/>

  <rect class="grp" x="694" y="44" width="242" height="210" rx="8"/>
  <text class="lbl" x="706" y="64">最後にボーカルと照合</text>

  <rect class="chip" x="706" y="76" width="218" height="44" rx="5"/>
  <text class="s" x="718" y="94">真上のボーカル音が</text>
  <text class="s" x="718" y="108">その場の上限になる</text>

  <rect class="chip" x="706" y="132" width="218" height="44" rx="5"/>
  <text class="s" x="718" y="150">衝突を解消し、孤立した</text>
  <text class="s" x="718" y="164">音は埋め直す</text>

  <rect class="chip" x="706" y="188" width="218" height="44" rx="5"/>
  <text class="s" x="718" y="206">直した結果が跳びすぎたり</text>
  <text class="s" x="718" y="220">コード外になった音は捨てる</text>

  <path class="seam" d="M 24 278 H 936"/>
  <text class="s" x="480" y="298" text-anchor="middle">Aux は自分でパートを選びません。機能は Blueprint、音域はセクション、最後の判断はボーカルが持ちます。</text>
</svg>
